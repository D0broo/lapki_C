name: ingest-issue
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Post the request comment on issue 1 as github-actions[bot]
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/D0broo/lapki_C/issues/1/comments \
            -f body='@D0broo заміни підінтегральну функцію з sin^2(x) на x^2 * sin(x) (тобто x * x * sin(x) у коді C) і відкрий Pull Request.'
